[project]
name = "open-primeagent"
version = "0.1.2"
description = "Persistent Python, long-lived sub-agents and a continual harness for the coding agent you already use"
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "softkleenex" }]
keywords = ["mcp", "agent", "rlm", "claude-code", "codex", "ipython", "sub-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "mcp>=1.2",           # MCP server (stdio)
  "jupyter-client>=8",  # drives the persistent IPython kernel
  "ipykernel>=6",       # the kernel itself
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/softkleenex/open-primeagent"
Documentation = "https://github.com/softkleenex/open-primeagent/tree/main/docs"
Benchmarks = "https://github.com/softkleenex/open-primeagent/tree/main/bench"
Source = "https://github.com/softkleenex/open-primeagent"
Issues = "https://github.com/softkleenex/open-primeagent/issues"

[project.scripts]
# `uvx <package>` runs the executable whose name matches the package, so
# without this entry the install line every doc advertises -
# `uvx open-primeagent` - fails with "an executable named `open-primeagent` is
# not provided". `opa` stays the name you type once it is on your PATH.
open-primeagent = "opa.server:main"
opa = "opa.server:main"
opa-child = "opa.child_server:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# Two top-level packages, one distribution. `opa_runtime` used to be a separate
# workspace member, which meant `uvx open-primeagent` could not resolve it -- the
# install line in our own README did not work. Shipping both from here keeps the
# kernel-side name (it mirrors upstream's in-kernel `rlm` package) without asking
# anyone to install two things.
[tool.hatch.build.targets.wheel]
packages = ["src/opa", "runtime/src/opa_runtime"]

[tool.hatch.build.targets.sdist]
include = ["src", "runtime/src", "skills", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
src = ["src", "runtime/src"]
# _ref: upstream clone, read-only. examples: kernel cell code, uses top-level await.
extend-exclude = ["_ref", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: integration tests that boot a real IPython kernel",
  "child: spawns a real coding-agent CLI as a child (needs auth and token quota)",
]
addopts = "-m 'not child'"   # child tests run only when asked for with -m child

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

# The README is written with relative links so GitHub resolves them. PyPI
# resolves them against pypi.org instead, so on the project page - which is
# where `pip install` and the version badge land people - all 34 of them were
# 404s, including "read this one" pointing at the security doc.
#
# Rewrite them to absolute GitHub URLs for the PyPI description only, leaving
# the file itself alone. Pure `#anchor` links are excluded: those work inside
# the rendered description, and sending them to GitHub would bounce the reader
# off the page they are already reading.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/softkleenex/open-primeagent/blob/main/\1)'
