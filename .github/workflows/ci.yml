name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: lint
        # The whole tree, not just src+tests: release.yml lints `.` before it
        # will publish, so a narrower gate here means lint failures in bench/ or
        # tooling stay invisible until someone tries to cut a release.
        run: uv run ruff check .
      - name: unit tests
        run: uv run pytest -q -m "not slow" --cov=src/opa --cov=runtime/src/opa_runtime --cov-report=term
      - name: integration tests (real IPython kernel)
        run: uv run pytest -q -m "slow and not child"
